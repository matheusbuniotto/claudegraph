[project]
name = "airbend"
version = "0.1.0"
description = "Agent runtime — register graphs, run goals, control state"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matheus Buniotto" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
airbend = "airbend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airbend"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
